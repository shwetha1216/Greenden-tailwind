<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<style>
  .container {
    display: grid;
    grid-template-rows: 1fr 5fr 1fr;

  }

  .header {
    background-color: rgb(26, 182, 138);
    padding: 10px;
    color: white;
    display: grid;
    align-items: center;
    justify-content: center;
    /* text-align: center; */
    /* margin: 10px; */
    /* display: grid;
  grid-template-columns: 1fr; */
  }

  .middle {
    color: white;
    display: grid;
    grid-template-columns: 1fr 3fr;
    /* margin: 10px; */

  }

  .middle__s1 {
    background-color: rgb(101, 228, 101);
    display: grid;
    align-items: center;
    justify-content: center;

  }

  .middle__s2 {
    background-color: orange;
    display: grid;
    grid-template-rows: 1fr 1fr;
    align-items: center;
    justify-content: center;
  }

  .middle__s2__image {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    
  }

  .middle__s2__image div{
    background-color: red;
    width: 100px;
    height: 100px;
    display: grid;
    align-items: center;
    justify-content: center;
    margin: 5px;
  }

  .middle__s2__article {
    /* background-color: yellow; */
    display: grid;
    justify-content: center;
    align-items: end;
    height: 100%;
  }


  /* .middle__s2__image{
    background-color: aqua;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
  } */

  .footer {
    background-color: rgb(26, 182, 138);
    color: white;
    display: grid;
    align-items: center;
    justify-content: center;
    /* text-align: center; */
    padding: 5px;
  }
</style>

<body>

  <div class="container">

    <div class="header">Header</div>

    <div class="middle">
      <div class="middle__s1">Aside</div>
      <div class="middle__s2">
        <div class="middle__s2__article">Article</div>
        <div class="middle__s2__image">
          <div>Image</div>
          <div>Image</div>
          <div>Image</div>
        </div>
      </div>
    </div>

    <div class="footer">Footer</div>

  </div>

</body>

</html>
